# FEN exam pipeline — full stack (Airflow + MinIO + Paddle + Selenium)
# Stack đầy đủ cho crawl → classify → OCR demo
name: fen-exam

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    # Same secret on webserver+scheduler so log JWT (:8793) is accepted /
    # Cùng secret webserver+scheduler để JWT đọc log (:8793) được chấp nhận
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-fen-exam-airflow-local-secret}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # Shared base log folder (volume below) / Thư mục log chung (volume bên dưới)
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    FEN_CONFIG_PATH: /opt/fen-exam/dags/config.ini
    FEN_COMPOSE_PROJECT: fen-exam
    FEN_MINIO_ENDPOINT: http://minio:9000
    AIRFLOW__CORE__DAGS_FOLDER: /opt/fen-exam/dags
    FEN_HOST_PROJECT_DIR: ${FEN_HOST_PROJECT_DIR:-}
  volumes:
    - ./:/opt/fen-exam
    - /var/run/docker.sock:/var/run/docker.sock
    # Webserver reads task logs written by scheduler / Webserver đọc log do scheduler ghi
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./scripts/init_minio.sh:/init_minio.sh:ro
    entrypoint: ["/bin/sh", "/init_minio.sh"]
    restart: "no"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Use DB airflow (not default DB=username) / Dùng DB airflow (không mặc định DB=tên user)
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USERNAME:-admin}" \
          --password "${AIRFLOW_PASSWORD:-admin}" \
          --firstname FEN --lastname Exam --role Admin --email admin@fen.local || true
        echo "Airflow init done"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    # Stable DNS name for inter-service calls / Tên DNS cố định giữa các service
    hostname: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    # Task logs advertise this host:8793 — must resolve from webserver /
    # Log task gắn host:8793 — webserver phải resolve được
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  paddle-ocr:
    build:
      context: ./docker/paddle-ocr
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    environment:
      PADDLE_MAX_IMAGE_SIDE: "2400"

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: "2gb"
    volumes:
      - selenium-profile:/data/chrome-profile
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      # noVNC password for manual FB login / Mật khẩu noVNC khi login FB thủ công
      SE_VNC_PASSWORD: secret
      SE_START_VNC: "true"
      SE_START_NO_VNC: "true"

  fen-job:
    profiles: ["job"]
    image: fen-exam-fen-job
    build:
      context: .
      dockerfile: docker/fen-job/Dockerfile
    env_file:
      - .env
    environment:
      FEN_CONFIG_PATH: /opt/fen-exam/dags/config.ini
      FEN_MINIO_ENDPOINT: http://minio:9000
      FEN_RUNTIME: docker
      FEN_SKIP_LOCAL_OUTPUT: "true"
      FEN_PATHS_OUTPUT_DIR: /tmp/fen-output
      SELENIUM_REMOTE_URL: http://selenium-chrome:4444/wd/hub
      PADDLE_SERVICE_URL: http://paddle-ocr:8080
    volumes:
      - ./dags:/opt/fen-exam/dags:ro
      - ./output:/tmp/fen-output
    depends_on:
      - minio
      - paddle-ocr

volumes:
  minio-data:
  postgres-data:
  selenium-profile:
  airflow-logs:
